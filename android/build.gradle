buildscript {
  ext.GertecPrinter = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return GertecPrinter[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

android {
  namespace "com.gertecprinter"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "com.facebook.react:react-android"

  // Required by the Gertec AAR below, whose bundled theme extends Theme.Material3.*.
  implementation "com.google.android.material:material:1.12.0"

  // Gertec EasyLayer SDK for the TSG820 built-in printer. Distributed by Gertec as a
  // raw AAR via their developer portal (developer.gertec.com.br) -- not on Maven.
  implementation files("libs/EasyLayer-TSG820-v2.1.8-release.aar")
}
