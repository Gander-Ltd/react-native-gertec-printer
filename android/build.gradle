buildscript {
  ext.GertecPrinter = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return GertecPrinter[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

android {
  namespace "com.gertecprinter"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

// AGP refuses to bundle a *release* AAR that has a direct `files(...)` local .aar
// dependency ("Direct local .aar file dependencies are not supported when building
// an AAR"). A flatDir repo dodges that, but it's only visible within this module's
// own build -- a consuming app's :app project doesn't see it when resolving its own
// release classpath ("project declares repositories, effectively ignoring the
// repositories declared in the settings"), so `implementation(name:, ext:)` fails
// there with "Could not find :EasyLayer-TSG820-v2.1.8-release:". A real local Maven
// repo (proper group:artifact:version coordinates) resolves the same way an ordinary
// external dependency would and doesn't hit either problem. Consuming apps must add
// this repo too -- see android/local-maven-repo and this package's README.
repositories {
  maven {
    url uri("$projectDir/local-maven-repo")
  }
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"

  // Required by the Gertec AAR below, whose bundled theme extends Theme.Material3.*.
  implementation "com.google.android.material:material:1.12.0"

  // Gertec EasyLayer SDK for the TSG820 built-in printer. Distributed by Gertec as a
  // raw AAR via their developer portal (developer.gertec.com.br) -- not on Maven, so
  // it's vendored as a local Maven repo (see android/local-maven-repo) instead.
  implementation "br.com.gertec:easylayer-tsg820:2.1.8"

  // compileOnly: only used to report swallowed native errors (see GertecPrinterModule's
  // reportToSentry) so they're visible even though we deliberately don't crash or reject
  // for them. Actually present at runtime via the consuming app's @sentry/react-native
  // dependency; version pinned to match its bundled sentry-android.
  compileOnly "io.sentry:sentry-android:7.22.6"
}
